[package]
name = "minmandate-rs"
version = "0.1.0"
edition = "2021"

[features]
# Explicit opt-in for the x86_64 halo2curves 4-limb Montgomery backend.
# The default build remains portable and does not emit BMI2/ADX instructions.
bmi2-adx = ["halo2curves/asm"]

[dependencies]
ff = "=0.13.1"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
fs2 = "=0.4.3"
group = "=0.13.0"
halo2curves = { version = "=0.9.0", features = ["std"] }
pairing = "=0.23.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
