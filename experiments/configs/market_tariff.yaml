schema_version: minmandate-market-tariff-v1
snapshot_date: 2026-07-10
currency: USD
integer_unit: nano_usd
scenario_multipliers_milli:
  low: 750
  nominal: 1000
  peak: 1500
uniform_price_control_nanos: 10000000
budget_reserve_nanos: 0

tariffs:
  m365_operation:
    pricing_source: https://www.microsoft.com/en-us/microsoft-365/business/microsoft-365-business-basic
    pricing_unit: normalized SaaS operation
    formula_kind: fixed
    base_nanos: 1000000
    budget_nominal_nanos: 1000000
    usage_formula: USD 6 user-month / 6,000 declared operations per user-month
    normalization_rule: Representative market estimate for calendar and directory operations; not a Microsoft per-call tariff.
  slack_operation:
    pricing_source: https://slack.com/pricing/pro
    pricing_unit: normalized SaaS operation
    formula_kind: fixed
    base_nanos: 1450000
    budget_nominal_nanos: 1450000
    usage_formula: USD 7.25 active-user-month / 5,000 declared operations per active-user-month
    normalization_rule: Representative market estimate; not a Slack per-call tariff.
  ses_outbound:
    pricing_source: https://aws.amazon.com/ses/pricing/
    pricing_unit: recipient plus outgoing payload
    formula_kind: recipient_and_payload
    recipient_nanos: 100000
    per_gib_nanos: 120000000
    budget_nominal_nanos: 200000
    usage_formula: USD 0.10/1,000 recipients + USD 0.12/GiB outgoing data
    normalization_rule: Public pay-as-you-go tariff; one nominal call budgets two recipients.
  s3_get:
    pricing_source: https://aws.amazon.com/s3/pricing/
    pricing_unit: GET request
    formula_kind: fixed
    base_nanos: 400
    budget_nominal_nanos: 400
    usage_formula: USD 0.0004/1,000 GET requests
    normalization_rule: First published request tier; free-tier credits excluded.
  s3_put:
    pricing_source: https://aws.amazon.com/s3/pricing/
    pricing_unit: PUT request plus payload
    formula_kind: payload_kib
    base_nanos: 5000
    unit_nanos: 0
    argument_fields: [content]
    budget_nominal_nanos: 5000
    usage_formula: USD 0.005/1,000 PUT requests; payload recorded but storage rent excluded
    normalization_rule: First published request tier; free-tier credits excluded.
  places_text_search:
    pricing_source: https://developers.google.com/maps/billing-and-pricing/pricing
    pricing_unit: text-search event
    formula_kind: fixed
    base_nanos: 32000000
    budget_nominal_nanos: 32000000
    usage_formula: USD 32/1,000 Places Text Search Pro events
    normalization_rule: First paid volume tier; monthly free cap excluded.
  places_detail:
    pricing_source: https://developers.google.com/maps/billing-and-pricing/pricing
    pricing_unit: place-detail event
    formula_kind: per_list_item
    base_nanos: 0
    unit_nanos: 17000000
    argument_field: restaurant_names
    budget_nominal_nanos: 34000000
    usage_formula: USD 17/1,000 Place Details Pro events per requested entity
    normalization_rule: Representative detail lookup; nominal budget assumes two entities.
  places_detail_hotel:
    pricing_source: https://developers.google.com/maps/billing-and-pricing/pricing
    pricing_unit: place-detail event
    formula_kind: per_list_item
    base_nanos: 0
    unit_nanos: 17000000
    argument_field: hotel_names
    budget_nominal_nanos: 34000000
    usage_formula: USD 17/1,000 Place Details Pro events per requested entity
    normalization_rule: Representative detail lookup; nominal budget assumes two entities.
  places_detail_car:
    pricing_source: https://developers.google.com/maps/billing-and-pricing/pricing
    pricing_unit: place-detail event
    formula_kind: per_list_item
    base_nanos: 0
    unit_nanos: 17000000
    argument_field: company_name
    budget_nominal_nanos: 34000000
    usage_formula: USD 17/1,000 Place Details Pro events per requested entity
    normalization_rule: Representative detail lookup; nominal budget assumes two entities.
  browser_session:
    pricing_source: https://www.browserless.io/pricing
    pricing_unit: 30-second browser unit
    formula_kind: fixed
    base_nanos: 2000000
    budget_nominal_nanos: 2000000
    usage_formula: one 30-second unit at USD 0.002 overage price
    normalization_rule: Market analogue for one web-backed action; no proxy or CAPTCHA units.
  browser_transaction:
    pricing_source: https://www.browserless.io/pricing
    pricing_unit: two 30-second browser units
    formula_kind: fixed
    base_nanos: 4000000
    budget_nominal_nanos: 4000000
    usage_formula: two 30-second units at USD 0.002 per unit
    normalization_rule: Representative booking-action estimate; not a vendor booking fee.
  financial_balance:
    pricing_source: https://stripe.com/financial-connections
    pricing_unit: successful balance API call
    formula_kind: fixed
    base_nanos: 100000000
    budget_nominal_nanos: 100000000
    usage_formula: USD 0.10 per successful balance call
    normalization_rule: Public Financial Connections tariff.
  financial_owner:
    pricing_source: https://stripe.com/financial-connections
    pricing_unit: successful owner/account call
    formula_kind: fixed
    base_nanos: 1500000000
    budget_nominal_nanos: 1500000000
    usage_formula: USD 1.50 per successful account-owner call
    normalization_rule: Public Financial Connections tariff used for identity/account retrieval.
  financial_history:
    pricing_source: https://stripe.com/financial-connections
    pricing_unit: transaction-history access
    formula_kind: fixed
    base_nanos: 300000000
    budget_nominal_nanos: 300000000
    usage_formula: USD 0.30 transaction-data tariff normalized to one benchmark access
    normalization_rule: Representative call estimate from an account-holder-month tariff; not exact per-call vendor pricing.
  payout:
    pricing_source: https://stripe.com/connect/pricing
    pricing_unit: payout
    formula_kind: fixed_plus_bps
    base_nanos: 250000000
    argument_field: amount
    basis_points: 25
    budget_nominal_nanos: 500000000
    usage_formula: USD 0.25 + 0.25% of payout amount
    normalization_rule: Public Connect payout tariff; nominal budget assumes USD 100 business amount.

